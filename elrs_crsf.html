<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Инструкция по настройке ExpressLRS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Основное содержание руководства -->
    <main class="guide-content">
        <header class="guide-header">
            <h1>🛠 Настройка аппаратуры ExpressLRS</h1>
        </header>
        <!-- Глава 1 -->
        <section id="chapter1" class="chapter">
            <div class="step">
                <h3><span class="step-number">1</span>Включение ELRS TX</h3>
                <p>Включите пульт ELRS</p>
                <p>Войдите в меню ELRS setup</p>
            </div>

            <div class="step">
                <h3><span class="step-number">2</span> Настройка трансляции телеметрии в Backpack</h3>
                <p>Войдите в настройку Backpack.</p>
                <div class="image-container">
                    <div>
                        <img src="images\elrs-backpack.jpg"
                             alt="Настройка порта"
                             class="guide-image image-30">
                        <p class="image-caption">Вход в настройку Backpack</p>
                    </div>
                </div>
                <p>Установите режим телеметрии ESP-NOW</p>
                <div class="image-container">
                    <div>
                        <img src="images\elrs-espnow.jpg"
                             alt="Настройка порта"
                             class="guide-image image-30">
                        <p class="image-caption">Настройка телеметрии</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- Навигационные кнопки -->
        <div class="nav-buttons">
            <a href="index.html#setup_crsf_manual" class="nav-btn">На главную страницу</a>
        </div>
    </main>

    <script>
        // Плавная прокрутка к якорям
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if(targetId === '#') return;

                const targetElement = document.querySelector(targetId);
                if(targetElement) {
                    window.scrollTo({
                        top: targetElement.offsetTop - 20,
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Подсветка текущего раздела при прокрутке
        window.addEventListener('scroll', function() {
            const chapters = document.querySelectorAll('.chapter');
            const scrollPosition = window.scrollY + 100;

            chapters.forEach(chapter => {
                const chapterTop = chapter.offsetTop;
                const chapterHeight = chapter.clientHeight;
                const chapterId = chapter.getAttribute('id');

                if(scrollPosition >= chapterTop && scrollPosition < chapterTop + chapterHeight) {
                    document.querySelectorAll('.toc a').forEach(link => {
                        link.style.fontWeight = link.getAttribute('href') === `#${chapterId}` ? 'bold' : 'normal';
                    });
                }
            });
        });
    </script>
</body>
</html>
